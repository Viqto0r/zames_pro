# The 29 bundled terminal themes, as shown by the gallery on every page.
# One entry per `docs/shots/theme-<id>.png`; `bg`/`accent` are the palette's
# own colors, read off the screenshot so the tile can paint itself BEFORE the
# PNG arrives (a gallery of 29 images that first flashes dark rectangles is
# worse than one that never moves).
#
# `light` must match LIGHT_PALETTES in src/theme-light.ts: a light tile on a
# dark page needs dark text on top of it.
#
# The ids and the order match ThemeName in src/types.ts and the list in
# docs/configuration*.md; test/docs-themes.test.ts fails when a screenshot or a
# ThemeName has no entry here.
