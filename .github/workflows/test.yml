name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Align CI with the toolchain the suite is verified on. Node 22's
          # test runner cancels a test when the event loop drains before the
          # test promise settles (our animation/watchdog timers are unref'd),
          # which showed up as `cancelled 2` + exit 1 while the same suite is
          # green on Node 24.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
