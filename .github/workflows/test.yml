name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Align CI with the toolchain the suite is verified on. Node 22's
          # test runner cancels a test when the event loop drains before the
          # test promise settles (our animation/watchdog timers are unref'd),
          # which showed up as `cancelled 2` + exit 1 while the same suite is
          # green on Node 24.
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # The coverage run IS the test run (same exit code), with a per-file
      # line/branch report printed so dead or untested modules are visible.
      - name: Tests (with coverage)
        run: npx tsx --test --experimental-test-coverage test/*.test.ts

      # Soft floor for the pure logic modules (commands/scheduler/net-capture/
      # xml-toolcall/diff/theme). Catches a module silently losing its tests.
      - name: Coverage gate (critical modules)
        run: npm run coverage:gate

      - name: Build
        run: npm run build

  # A single STABLE check for branch protection. The ruleset pins THIS job
  # name; if the internal `test` job is ever renamed/split, the required check
  # does not break — the gate simply waits for whatever `test` becomes.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test]
    # Always run, so the required check reports a real failure instead of
    # staying "pending" forever when a dependency job fails.
    if: always()
    steps:
      - name: Verify the test job succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job result: ${{ needs.test.result }}"
            exit 1
          fi
          echo "all checks passed"
