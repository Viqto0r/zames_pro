name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # HARD GATE: only PR s whose AUTHOR is Dependabot. We check the PR author
    # (`user.login`), not `github.actor`: the actor is whoever TRIGGERED the
    # event (a re-run, a label, a push to the branch) and could differ, while
    # the author is always the bot for its own PR s. A human PR can therefore
    # never reach the merge step, no matter how it is triggered.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # Belt-and-braces: the head branch must be one Dependabot creates. Even a
    # compromised/spoofed author field cannot point at an arbitrary branch.
    # Dependabot branches are named `dependabot/<ecosystem>/<dir>/<dep>`.
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Re-assert the branch guard inside the job too: if the head branch is
      # not a `dependabot/...` one, stop before touching the PR.
      - name: Verify the branch belongs to Dependabot
        run: |
          case "$HEAD_REF" in
            dependabot/*) echo "ok: $HEAD_REF" ;;
            *) echo "refusing: $HEAD_REF is not a dependabot branch"; exit 1 ;;
          esac

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Auto-merge only patch / minor bumps. A major (or a routine bump of a
      # dev toolchain like ESLint/TypeScript) needs a human review, and the
      # gate is the required CI checks: GitHub will only merge once they pass.
      - name: Enable auto-merge (patch/minor only)
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
