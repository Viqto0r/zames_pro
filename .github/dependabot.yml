version: 2
updates:
  # Keep GitHub Actions pinned versions fresh (security + deprecation warnings).
  # MONTHLY: routine bumps are not urgent, and a weekly cadence only added
  # PR noise. Security updates (CVE) are NOT governed by this schedule.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci

  # Runtime + dev dependencies. Grouped so one PR carries a batch of minor /
  # patch bumps instead of dozens of separate PR s. MONTHLY: with majors
  # ignored and minors auto-merged after green CI, this is low-noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # A major bump of a loose dependency needs a human decision (breaking
    # changes, toolchain compatibility), so do not open PR s for it. This blocks
    # the whole major category; a wanted major is done by hand.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
