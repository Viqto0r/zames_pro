name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.
        For security problems, use the private advisory link instead of a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `zames ...`
        2. Type `...`
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zames version
      description: Output of `zames --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: e.g. Node 24 on Ubuntu 24.04 / Windows 11 / WSL
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste any error output. The transcript path is printed at exit and is
        available via `/transcript` (files under `~/.zames/logs`).
        IMPORTANT: remove credentials and personal data before pasting.
    validations:
      required: false
